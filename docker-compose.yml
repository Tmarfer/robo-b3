# Serviços por fase:
#   lab  (padrão)  — Fase 1–3: dados e backtest.       docker compose run --rm lab <comando>
#   mt5  (perfil)  — Fase 4: experimental, não validado. docker compose --profile mt5 up -d mt5
# Os serviços da Fase 5 (bot, ponte de sinais, news-llm, dashboard) entram quando existirem.
#
# Docker publica portas por fora do ufw: toda porta fica presa a 127.0.0.1 (acesso via túnel SSH).

services:
  lab:
    build: .
    image: robo-b3-lab
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    network_mode: none   # o laboratório não precisa de rede

  mt5:
    profiles: [mt5]
    # Fixar uma tag específica depois de validar; confirmar no README da imagem os caminhos de
    # volume, a porta do noVNC e como ativar o servidor mt5linux (RPyC, 8001).
    image: gmag11/metatrader5_vnc:latest
    container_name: mt5
    env_file:
      - path: .env
        required: false
    volumes:
      - ./mt5-data:/config
    ports:
      - "127.0.0.1:3000:3000"   # noVNC — via túnel SSH
    expose:
      - "8001"                  # mt5linux/RPyC — só rede interna
    networks: [trading]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8001 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3g

networks:
  trading:
    driver: bridge
