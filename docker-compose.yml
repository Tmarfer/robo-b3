# Serviços por fase:
#   lab  (padrão)  — dados e backtest.                 docker compose run --rm lab <comando>
#   mt5  (perfil)  — MT5 demo no Wine, tela no navegador. docker compose --profile mt5 up -d mt5
#                    Fase 1: tela + exportação manual. Fase 4: ponte Python (mt5linux/RPyC).
# Os serviços da Fase 5 (bot, ponte de sinais, news-llm, dashboard) entram quando existirem.
#
# Docker publica portas por fora do ufw: toda porta fica presa a 127.0.0.1 (acesso via túnel SSH).

services:
  lab:
    build: .
    image: robo-b3-lab
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    network_mode: none   # o laboratório não precisa de rede

  mt5:
    profiles: [mt5]
    # Imagem do autor do mt5linux (github.com/lucas-campagna/mt5linux, pasta docker/).
    # Depois do 1º teste OK, fixar pelo digest: docker inspect --format '{{index .RepoDigests 0}}'
    # lprett/mt5linux:latest  -> colar em MT5_IMAGE no .env. Atualizações só fora do pregão.
    image: ${MT5_IMAGE:-lprett/mt5linux:latest}
    container_name: mt5
    entrypoint:
      - sh
      - -c
      - |
        rm -f /opt/wineprefix/drive_c/server
        sed -i 's/1024x768x16/$${SCREEN_RESOLUTION:-1440x900x24}/g' /app/src/xvfb.sh 2>/dev/null || true
        sed -i 's|mkfifo -m 666 .*|rm -f /opt/wineprefix/drive_c/server; mkfifo -m 666 /opt/wineprefix/drive_c/server|' /app/src/automation.sh 2>/dev/null || true
        exec /app/src/main.sh
    environment:
      # resolução da tela virtual (padrão 1440x900 widescreen para caber no Mac sem cortar)
      SCREEN_RESOLUTION: ${SCREEN_RESOLUTION:-1440x900x24}
      # senha da tela (noVNC); vazia = sem senha — só aceitável porque a porta é local + túnel
      UI_PASSWORD: ${MT5_UI_PASSWORD:-}
      NOVNC_HOST: localhost        # o navegador do Mac chega pelo túnel SSH
      # login automático opcional; vazio = entrar pela tela e salvar a senha no terminal
      MT5_LOGIN: ${MT5_LOGIN:-}
      MT5_SERVER: ${MT5_SERVER:-}
      MT5_PASSWORD: ${MT5_PASSWORD:-}
    volumes:
      # MT5 roda em modo portable em C:\MT5: histórico (Bases), perfis e MQL5 persistem aqui
      - ./mt5-data:/opt/wineprefix/drive_c/MT5
      # C:\export dentro do MT5 = data/raw/ no host — destino das exportações de barras
      - ./data/raw:/opt/wineprefix/drive_c/export
    ports:
      - "127.0.0.1:8080:8080"   # página noVNC — via túnel SSH
      - "127.0.0.1:5901:5901"   # websocket do noVNC — via túnel SSH
    expose:
      - "18812"                 # mt5linux/RPyC — só rede interna (Fase 4)
    networks: [trading]
    restart: unless-stopped
    healthcheck:
      # mostra estado; não reinicia sozinho (a imagem tem watchdog próprio para terminal e RPyC).
      # Lê /proc/net/tcp em vez de depender do nc da imagem: 18812 = 0x4974, estado 0A = LISTEN
      test: ["CMD-SHELL", "grep -qiE ':4974 [0-9a-f]{8}:0000 0A' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 3g

networks:
  trading:
    driver: bridge
